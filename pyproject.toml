[project]
name = "flask-nginx"
version = "0.9.10"
description = "install flask/quart/starlette websites into nginx and systemd"
authors = [{ name = "arabidopsis", email = "ian.castleden@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["jinja2>=3,<4", 'click>=8,<9']

[project.optional-dependencies]
psutil = ["psutil>=5.4"]


[project.scripts]
footprint = "flask_nginx.__main__:cli"

[tool.hatch.build.targets.sdist]
include = ["/flask_nginx"]

[tool.hatch.build.targets.wheel]
include = ["/flask_nginx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "flask>=3.1.3",
    "quart>=0.20.0",
]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    '^fabfile\.py$', # Excludes specific file using literal string (single quotes)
    'tests/',        # Excludes anything matching this path substring
]

[tool.ruff]
line-length = 120
[tool.ruff.lint]

select = ["ALL"]

ignore = [
    "CPY001",  # Missing copyright notice at top of file
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function
    "D104",    # Missing docstring in public package
    "D107",    # Missing docstring in __init__
    "D203",    # Incompatible with D211, which is enabled by default docstrings...
    "D213",    # incompatible with D212, which is enabled by default
    "COM812",  # missing trailing comma. redundant with ruff formatting
    "DTZ005",  # Don't require timezone-aware datetimes
    "S603",    # subprocess call: check for execution of untrusted input
    # "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed 
    "PLW2901", # loop variable overwritten.
    "ERA001",  # found commented out code
    # "S704",    # unsafe use of MarkupSafe
    # "T201",    # print statements found
    "PLC0415", # import should be at top of file
    "RSE102",  # Unenecessary parentheses on raised exception
    "PLR0913", # too many arguments in function definition
    # "PLR0917", # too many positional arguments in function definition
    "FBT001", # Boolean-typed positional argument in function definition
    "TID252", # Prefer absolute imports over relative imports from parent modules
    "PTH"
]
[tool.ruff.lint.isort]
combine-as-imports = true
